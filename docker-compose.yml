version: '3.8'

services:
  paloalto-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paloalto-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    stdin_open: true
    tty: true
